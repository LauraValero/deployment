name: CI/CD con validacion IA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Tests unitarios (quiz logic + estructura)
        run: npm test

      - name: Build de produccion
        run: npm run build

      - name: Verificar que el build genero archivos
        run: |
          test -f dist/index.html || (echo "ERROR: dist/index.html no existe" && exit 1)
          echo "Build verificado: dist/index.html existe"

  deploy:
    needs: test-and-validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy a produccion
        run: echo "Deploy automatico via Vercel (conectado al repo por GitOps)"

  post-deploy-check:
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que el sitio responde
        run: |
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://exposicionfinal.vercel.app)
          if [ "$STATUS" -eq 200 ]; then
            echo "Sitio en produccion responde OK (HTTP $STATUS)"
          else
            echo "ALERTA: sitio responde HTTP $STATUS"
            exit 1
          fi
